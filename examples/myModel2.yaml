imports:
    - torch:
    - nn: torch.nn

model:
      name: MLAY2
      init_args:
            num_classes: 10

      # init_code does not need to be provided, except if you want custom init logic
      init_code: |
            if self.num_classes > 10:
                  self.number = 123
            else:
                  self.number = 456

      structure:
            backbone:
                  Sequential:
                      - __MLAY__: "../../examples/myModel1.yaml"
                      - __MLAY__: "../../examples/myModel1.yaml"
            custom_block:
                  Linear:
                        in_features: 64
                        out_features: 64
      forward_code: |
            y = self.backbone(x)
            y = self.custom_block(x)
            return x + y

      replace:
          # index is provided as a list of indexes (mostly if backbone contains sequential, etc...) or you can speficy a name it will change the first match
          # keep in mind replacements are the last thing to execute inside init function
          - backbone:
                  index: [ 1, 1 ]
                  with: Conv2d
                  kwargs:
                        in_channels: 3
                        out_channels: 16
                        kernel_size: 5
                        stride: 2
                        padding: 3
          - backbone:
                  index: [ 0, "backbone", "Conv2d" ]
                  with: Conv2d
                  kwargs:
                        in_channels: 3
                        out_channels: 16
                        kernel_size: 7
                        stride: 2
                        padding: 3
