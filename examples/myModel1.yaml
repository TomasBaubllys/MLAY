imports:
    - torch:
    - nn: torch.nn

model:
      name: MLAY1
      init_args:
            num_classes: 10

      structure:
            backbone:
                  Sequential:
                      - Conv2d:
                              in_channels: 3
                              out_channels: 16
                              kernel_size: 3
                              stride: 2
                              padding: 1
                      - BatchNorm2d:
                              num_features: 16
                      - ReLU:
                              inplace: True
                      - Conv2d:
                              in_channels: 16
                              out_channels: 32
                              kernel_size: 3
                              stride: 2
                              padding: 1
                      - BatchNorm2d:
                              num_features: 32
                      - ReLU:
                              inplace: True
                      - AdaptiveAvgPool2d:
                              output_size: [ 1, 1 ]
                      - Flatten:
                      - Linear:
                              in_features: 32
                              out_features: num_classes
