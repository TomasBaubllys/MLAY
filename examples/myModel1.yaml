imports:
    - torch:
    - nn: torch.nn

constants:
      num_classes: 10

model:
      name: MLAY1
      init_args:
            var1:
            var2: 10
            var3: None

      structure:
            backbone:
                  Sequential:
                      - Conv2d:
                              in_channels: 3
                              out_channels: 16
                              kernel_size: 3
                              stride: 2
                              padding: 1
                      - BatchNorm2d:
                              num_features: 16
                      - ReLU:
                              inplace: True
                      - Conv2d:
                              in_channels: 16
                              out_channels: 32
                              kernel_size: 3
                              stride: 2
                              padding: 1
                      - BatchNorm2d:
                              num_features: 32
                      - ReLU:
                              inplace: True
                      - AdaptiveAvgPool2d:
                              output_size: [ 1, 1 ]
                      - Flatten:
                      - Linear:
                              in_features: 32
                              out_features: num_classes
            classifier:
                  Linear:
                        in_features: num_classes
                        out_features: num_classes
      forward:
          - backbone
          - classifier
